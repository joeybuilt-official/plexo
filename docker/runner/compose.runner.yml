# Runner jail compose fragment (ADR 0050 / plan §9-D2).
# Merge into the stack: docker compose -f compose.yml -f runner/compose.runner.yml ...
# Paths are relative to the docker/ dir (where the primary compose.yml lives).
services:
  runner:
    build:
      context: ..
      dockerfile: docker/runner/Dockerfile.runner
    # Enforce the non-root uid even if the image USER were ever overridden.
    user: "10001:10001"
    # Drop every Linux capability — a confined agent needs none.
    cap_drop:
      - ALL
    security_opt:
      # Block setuid/privilege-escalation binaries entirely.
      - "no-new-privileges:true"
      # Default-deny syscall allowlist (validate with validate-jail.sh).
      - "seccomp=./runner/seccomp-runner.json"
    # Immutable rootfs — the runner cannot persist or tamper with its own image.
    read_only: true
    # The only writable surfaces, both ephemeral and per-container:
    tmpfs:
      # scratch: no exec (can't run dropped binaries), no setuid.
      - "/tmp:rw,noexec,nosuid,size=256m"
      # per-session work dir owned by uid 10001; noexec left OFF only if the
      # runner must exec tool binaries it writes — keep nosuid regardless.
      - "/work:rw,nosuid,size=1g"
    # Fork-bomb ceiling.
    pids_limit: 512
    mem_limit: 2g
    cpus: "2.0"
    # A jailed run is one-shot; never auto-restart a killed confinement.
    restart: "no"
    networks:
      - runner-jail
    environment:
      # Hard wall-clock ceiling (ms) applied by entrypoint.sh timeout wrapper.
      RUNNER_WALLCLOCK_MS: "120000"

networks:
  runner-jail:
    # internal:true => egress default-DENY. Containers on this network cannot
    # reach the internet or other stacks.
    internal: true
    # SANCTIONED-EGRESS FOLLOW-UP (not built here): the ONLY approved outbound
    # path is an allowlisted forward-proxy service (e.g. `runner-egress-proxy`)
    # dual-homed on runner-jail + an egress network, enforcing a domain
    # allowlist. Until it exists, the runner has NO network egress. See ADR 0050.
