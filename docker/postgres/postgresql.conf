# Plexo PostgreSQL configuration overrides
# Mounted into the postgres container via docker-compose.yml
# Base config is pgvector/pgvector:pg16 defaults — only overrides listed here.

# ── WAL archiving (DI-007) ────────────────────────────────────────
# Enables point-in-time recovery (PITR) by archiving WAL segments.
# The archive_command copies each completed WAL file to /backups/wal/
# which is the same volume used by the backup sidecar.
wal_level = replica
archive_mode = on
archive_command = 'mkdir -p /backups/wal && test ! -f /backups/wal/%f && cp %p /backups/wal/%f'

# ── Network ───────────────────────────────────────────────────────
# Listen on all interfaces so containers on the docker network can
# connect. The default (localhost) only binds the loopback interface,
# which causes ECONNREFUSED from the api container.
listen_addresses = '*'

# ── Connection tuning ─────────────────────────────────────────────
# Modest settings for a single-VPS deployment (512MB mem_limit).
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 256MB

# ── Logging ───────────────────────────────────────────────────────
log_min_duration_statement = 500
log_line_prefix = '%t [%p] %q%u@%d '
