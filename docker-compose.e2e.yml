x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

# Ephemeral E2E test stack — for running Playwright E2E specs locally
# (typically from a Claude Code / Claude Desktop session on the Linux NAS
# box, but works anywhere docker is available).
#
# Entry points:
#   pnpm e2e:up      — boot the stack, wait for health
#   pnpm e2e:test    — run the P0-P2 Playwright suite against it
#   pnpm e2e:logs    — tail container logs
#   pnpm e2e:reset   — tear down + bring back up (clean DB)
#   pnpm e2e:down    — tear down + purge volumes
#
# All state lives in tmpfs so a `down -v` returns to a clean DB. Ports
# are bound to 127.0.0.1 only — nothing in this file is meant to be
# reachable from outside the host.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: "no"
    logging: *default-logging
    hostname: plexo-db
    environment:
      POSTGRES_USER: plexo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-e2e-test-password}
      POSTGRES_DB: plexo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plexo -d plexo"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    tmpfs:
      - /var/lib/postgresql/data
    mem_limit: 384m

  redis:
    image: valkey/valkey:8-alpine
    restart: "no"
    logging: *default-logging
    command: valkey-server --maxmemory 64mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-e2e-test-redis}
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD:-e2e-test-redis}", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    tmpfs:
      - /data
    mem_limit: 96m

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    entrypoint: ["/bin/sh", "/migrate.sh"]
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://plexo:${POSTGRES_PASSWORD:-e2e-test-password}@plexo-db:5432/plexo
      MIGRATIONS_DIR: /app/packages/db/drizzle
    mem_limit: 256m

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://plexo:${POSTGRES_PASSWORD:-e2e-test-password}@plexo-db:5432/plexo
      REDIS_URL: redis://:${REDIS_PASSWORD:-e2e-test-redis}@redis:6379
      PUBLIC_URL: http://localhost:3000
      PUBLIC_DOMAIN: localhost
      SESSION_SECRET: ${SESSION_SECRET:-e2e0000000000000000000000000000000000000000000000000000000session}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-e2e0000000000000000000000000000000000000000000000000000encrypt}
      AUTH_PROVIDER: better-auth
      AUTH_DATABASE_URL: postgresql://plexo:${POSTGRES_PASSWORD:-e2e-test-password}@plexo-db:5432/plexo
      AUTH_SECRET: ${AUTH_SECRET:-e2e000000000000000000000000000000000000000000000000000000000auth}
      BETTER_AUTH_URL: http://localhost:3000
      PLEXO_SERVICE_KEY: ${PLEXO_SERVICE_KEY:-e2e00000000000000000000000000000000000000000000000000000service}
      # e2e-only dummies: let the parity harness (scripts/parity-harness.mjs) mint
      # fabric device tokens + grants against the throwaway stack. Same pattern as
      # PLEXO_SERVICE_KEY above.
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-e2e-admin@example.com}
      FABRIC_DEVICE_TOKEN_SECRET: ${FABRIC_DEVICE_TOKEN_SECRET:-e2e00000000000000000000000000000000000000000000000000000fabric}
      CORS_ORIGINS: http://localhost:3000
      ALLOW_SIDELOAD: "false"
      ENABLE_SPRINT_CODING_TASKS: "false"
      PLEXO_MARKETING_ENABLED: "false"
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test:
        ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 768m

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: "no"
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      AUTH_DATABASE_URL: postgresql://plexo:${POSTGRES_PASSWORD:-e2e-test-password}@plexo-db:5432/plexo
      AUTH_SECRET: ${AUTH_SECRET:-e2e000000000000000000000000000000000000000000000000000000000auth}
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      INTERNAL_API_URL: http://api:3001
      PLEXO_SERVICE_KEY: ${PLEXO_SERVICE_KEY:-e2e00000000000000000000000000000000000000000000000000000service}
      PLEXO_MARKETING_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 512m

networks:
  default:
    name: plexo-e2e-${COMPOSE_PROJECT_NAME:-default}
