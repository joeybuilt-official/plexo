<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Terminal Frame: open bracket pair with signal dot -->
  <!-- Left bracket -->
  <path d="M8 10 L14 10 L14 13 L11 13 L11 35 L14 35 L14 38 L8 38 Z" fill="none" stroke="#00E5A0" stroke-width="2" stroke-linejoin="miter"/>
  <!-- Right bracket -->
  <path d="M40 10 L34 10 L34 13 L37 13 L37 35 L34 35 L34 38 L40 38 Z" fill="none" stroke="#00E5A0" stroke-width="2" stroke-linejoin="miter"/>
  <!-- Signal dot: agent heartbeat -->
  <circle cx="24" cy="24" r="3.5" fill="#00E5A0"/>
  <!-- Two horizontal traces: memory lanes -->
  <line x1="17" y1="20" x2="31" y2="20" stroke="#00E5A0" stroke-width="1.5" opacity="0.5"/>
  <line x1="17" y1="28" x2="31" y2="28" stroke="#00E5A0" stroke-width="1.5" opacity="0.5"/>
</svg>
