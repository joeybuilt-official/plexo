<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Tesseract Frame: nested squares rotated, representing dimensional cognition layers -->
  <!-- Outer square -->
  <rect x="6" y="6" width="36" height="36" fill="none" stroke="#4DAAFC" stroke-width="1.5"/>
  <!-- Inner square, rotated 45deg -->
  <rect x="14.5" y="14.5" width="19" height="19" fill="none" stroke="#4DAAFC" stroke-width="1.5" transform="rotate(45 24 24)"/>
  <!-- Connecting vertices: corners to inner corners -->
  <line x1="6" y1="6" x2="10.56" y2="24" stroke="#4DAAFC" stroke-width="1" opacity="0.35"/>
  <line x1="42" y1="6" x2="24" y2="10.56" stroke="#4DAAFC" stroke-width="1" opacity="0.35"/>
  <line x1="42" y1="42" x2="37.44" y2="24" stroke="#4DAAFC" stroke-width="1" opacity="0.35"/>
  <line x1="6" y1="42" x2="24" y2="37.44" stroke="#4DAAFC" stroke-width="1" opacity="0.35"/>
  <!-- Center node -->
  <circle cx="24" cy="24" r="2" fill="#4DAAFC"/>
</svg>
