<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Strata Mark: three horizontal layers with vertical signal pierce -->
  <!-- Top stratum -->
  <rect x="10" y="10" width="28" height="5" rx="1" fill="none" stroke="#E04AFF" stroke-width="1.5"/>
  <!-- Middle stratum (wider, primary) -->
  <rect x="6" y="21" width="36" height="6" rx="1" fill="none" stroke="#E04AFF" stroke-width="1.5"/>
  <!-- Bottom stratum -->
  <rect x="10" y="33" width="28" height="5" rx="1" fill="none" stroke="#E04AFF" stroke-width="1.5"/>
  <!-- Vertical signal pierce: a line cutting through all layers -->
  <line x1="24" y1="6" x2="24" y2="42" stroke="#E04AFF" stroke-width="2" stroke-dasharray="2 3"/>
  <!-- Signal nodes at intersection points -->
  <circle cx="24" cy="12.5" r="1.5" fill="#E04AFF"/>
  <circle cx="24" cy="24" r="2" fill="#E04AFF"/>
  <circle cx="24" cy="35.5" r="1.5" fill="#E04AFF"/>
</svg>
