  <circle cx="24" cy="24" r="3.5" fill="#7bbfd4"/>
  <circle cx="24" cy="36" r="3.5" fill="#7bbfd4"/>
  <line x1="14" y1="43" x2="34" y2="43" stroke="#7bbfd4" stroke-width="2.5" stroke-linecap="round"/>
</svg>
