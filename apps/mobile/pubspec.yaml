name: plexo_mobile
description: "Plexo native client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Mirrors the fonto_mobile stack (hand-written http client + manual stores,
# no Riverpod/go_router/dio/openapi). Phase 0 keeps the dep set lean; media,
# firebase/push, biometric land in later phases.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.0
  google_fonts: ^6.2.1
  app_links: ^6.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
