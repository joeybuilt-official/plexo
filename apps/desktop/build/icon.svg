<!-- Plexo Delta-Frame mark: closed triangle with differently-colored vertex
     dots (accent blue / signal green / amber). Source art for the app icon;
     electron-builder rasterizes build/icon.png into the .ico. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="96" fill="#101520"/>
  <g transform="translate(256 270) scale(9.2) translate(-24 -26)">
    <polygon points="24,10 36,34 12,34" stroke="#E2E8F0" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="24" cy="10" r="3" fill="#4DAAFC"/>
    <circle cx="12" cy="34" r="3" fill="#10B981"/>
    <circle cx="36" cy="34" r="3" fill="#F59E0B"/>
  </g>
</svg>
