<!-- Plexo Tesseract Frame mark (brand/plexo-app-icon-512.svg). Source art for
     the app icon; electron-builder rasterizes build/icon.png into the .ico. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="96" fill="#101520"/>
  <!-- Outer square -->
  <rect x="86" y="86" width="340" height="340" stroke="#4DAAFC" stroke-width="16" fill="none"/>
  <!-- Inner rotated square -->
  <polygon points="256,86 426,256 256,426 86,256" stroke="#4DAAFC" stroke-width="16" fill="none"/>
  <!-- Projection lines -->
  <line x1="86" y1="86" x2="86" y2="256" stroke="#4DAAFC" stroke-width="6" opacity="0.5"/>
  <line x1="426" y1="86" x2="426" y2="256" stroke="#4DAAFC" stroke-width="6" opacity="0.5"/>
  <line x1="86" y1="426" x2="86" y2="256" stroke="#4DAAFC" stroke-width="6" opacity="0.5"/>
  <line x1="426" y1="426" x2="426" y2="256" stroke="#4DAAFC" stroke-width="6" opacity="0.5"/>
  <!-- Center node -->
  <circle cx="256" cy="256" r="28" fill="#4DAAFC"/>
</svg>
