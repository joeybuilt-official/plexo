<!-- Plexo Delta-Frame mark (triangle + three vertex dots). Source art for the
     app icon; electron-builder rasterizes build/icon.png into the multi-size .ico. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect width="256" height="256" rx="56" fill="#101520"/>
  <rect x="4.5" y="4.5" width="247" height="247" rx="51.5" fill="none" stroke="#253354" stroke-width="4.5"/>
  <g transform="translate(128 128) scale(4.25) translate(-24 -22)"
     fill="none" stroke="#4DAAFC" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <line x1="24" y1="10" x2="12" y2="34"/>
    <line x1="24" y1="10" x2="36" y2="34"/>
    <line x1="12" y1="34" x2="20" y2="34"/>
    <line x1="28" y1="34" x2="36" y2="34"/>
    <circle cx="24" cy="10" r="3" fill="#4DAAFC" stroke="none"/>
    <circle cx="12" cy="34" r="3" fill="#4DAAFC" stroke="none"/>
    <circle cx="36" cy="34" r="3" fill="#4DAAFC" stroke="none"/>
  </g>
</svg>
