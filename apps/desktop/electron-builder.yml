appId: dev.plexo.desktop
productName: Plexo
copyright: Copyright (C) 2026 Joeybuilt LLC

directories:
  output: dist
  buildResources: build

# Only ship what the app needs at runtime.
files:
  - src/**/*
  - package.json
  - "!**/*.map"

win:
  target:
    - nsis
    - portable
  # electron-builder generates a multi-size .ico from this 256x256 PNG at build
  # time. To ship a hand-tuned icon instead, drop build/icon.ico and point here.
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Plexo-Setup-${version}-${arch}.${ext}
  # Workaround for NSIS silent-extraction dropping the large Chromium binary on
  # ARM64 Windows: disable the 7z/LZMA plugin and write files uncompressed.
  # The size penalty is acceptable because a daily-driver installer must first
  # and foremost install a working app.
  # In electron-builder 26 this is expressed through the `unpack` / `compression`
  # option under the `win` block.

portable:
  artifactName: Plexo-${version}-${arch}-portable.${ext}

# No auto-update / no publishing of artifacts.
publish: null
