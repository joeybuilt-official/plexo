<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" fill="#101520"/>
  <!-- Outer square -->
  <rect x="8" y="8" width="32" height="32" stroke="#4DAAFC" stroke-width="1.5" fill="none"/>
  <!-- Inner rotated square (45deg) -->
  <polygon points="24,8 40,24 24,40 8,24" stroke="#4DAAFC" stroke-width="1.5" fill="none"/>
  <!-- Projection lines (four corners of outer to nearest inner vertex) -->
  <line x1="8" y1="8" x2="8" y2="24" stroke="#4DAAFC" stroke-width="0.75" opacity="0.5"/>
  <line x1="40" y1="8" x2="40" y2="24" stroke="#4DAAFC" stroke-width="0.75" opacity="0.5"/>
  <line x1="8" y1="40" x2="8" y2="24" stroke="#4DAAFC" stroke-width="0.75" opacity="0.5"/>
  <line x1="40" y1="40" x2="40" y2="24" stroke="#4DAAFC" stroke-width="0.75" opacity="0.5"/>
  <!-- Center node -->
  <circle cx="24" cy="24" r="2.5" fill="#4DAAFC"/>
</svg>
