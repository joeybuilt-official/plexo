<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Plexo PNG Export</title>
<style>
  body { margin: 2rem; font-family: system-ui; background: #1a1a1a; color: #eee; }
  canvas { border: 1px solid #333; margin: 1rem 0; display: block; }
  button { padding: 0.5rem 1rem; margin: 0.25rem; cursor: pointer; }
  h2 { margin-top: 2rem; }
</style>
</head>
<body>
<h1>Plexo PNG Export</h1>
<p>Click each button to download the PNG.</p>

<h2>App Icon (512x512)</h2>
<canvas id="icon512" width="512" height="512"></canvas>
<button onclick="download('icon512','plexo-app-icon-512.png')">Download 512px Icon</button>

<h2>OG Image (1200x630)</h2>
<canvas id="og" width="1200" height="630"></canvas>
<button onclick="download('og','plexo-og-image.png')">Download OG Image</button>

<script>
const ACCENT = '#6db8cc';
const BG = '#2e3748';
const BG_DEEP = '#242936';
const TEXT = '#e8edf2';

// ── App Icon 512 ──
(function() {
  const c = document.getElementById('icon512');
  const ctx = c.getContext('2d');
  // Background with rounded corners
  ctx.fillStyle = BG;
  roundRect(ctx, 0, 0, 512, 512, 96);
  ctx.fill();
  // Delta frame
  ctx.strokeStyle = ACCENT;
  ctx.fillStyle = ACCENT;
  ctx.lineWidth = 16;
  ctx.lineCap = 'round';
  // Left edge
  ctx.beginPath(); ctx.moveTo(256, 106); ctx.lineTo(128, 362); ctx.stroke();
  // Right edge
  ctx.beginPath(); ctx.moveTo(256, 106); ctx.lineTo(384, 362); ctx.stroke();
  // Base left
  ctx.beginPath(); ctx.moveTo(128, 362); ctx.lineTo(213, 362); ctx.stroke();
  // Base right
  ctx.beginPath(); ctx.moveTo(299, 362); ctx.lineTo(384, 362); ctx.stroke();
  // Dots
  circle(ctx, 256, 106, 32);
  circle(ctx, 128, 362, 32);
  circle(ctx, 384, 362, 32);
})();

// ── OG Image 1200x630 ──
(function() {
  const c = document.getElementById('og');
  const ctx = c.getContext('2d');
  ctx.fillStyle = BG_DEEP;
  ctx.fillRect(0, 0, 1200, 630);

  // Centered delta frame (scaled from 48 viewBox, factor ~4)
  const ox = 480, oy = 200, s = 5;
  ctx.strokeStyle = ACCENT;
  ctx.fillStyle = ACCENT;
  ctx.lineWidth = 2 * s;
  ctx.lineCap = 'round';

  const pts = {
    top: [24*s + ox, 10*s + oy],
    bl:  [12*s + ox, 34*s + oy],
    br:  [36*s + ox, 34*s + oy],
    gl:  [20*s + ox, 34*s + oy],
    gr:  [28*s + ox, 34*s + oy],
  };

  ctx.beginPath(); ctx.moveTo(...pts.top); ctx.lineTo(...pts.bl); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(...pts.top); ctx.lineTo(...pts.br); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(...pts.bl); ctx.lineTo(...pts.gl); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(...pts.gr); ctx.lineTo(...pts.br); ctx.stroke();

  circle(ctx, ...pts.top, 3*s);
  circle(ctx, ...pts.bl, 3*s);
  circle(ctx, ...pts.br, 3*s);

  // "plexo" text
  ctx.fillStyle = TEXT;
  ctx.font = "600 44px 'Geist', 'Inter', system-ui, sans-serif";
  ctx.letterSpacing = '-0.02em';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('plexo', 54*s + ox, 28*s + oy);
})();

function circle(ctx, x, y, r) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function download(id, filename) {
  const c = document.getElementById(id);
  const a = document.createElement('a');
  a.download = filename;
  a.href = c.toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
