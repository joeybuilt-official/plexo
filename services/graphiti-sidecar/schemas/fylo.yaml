# Phase D-Fylo-1 per-app schema for Fylo (predictive personal finance).
# Loaded by services/graphiti-sidecar/schema_registry.py. See ADR 0027.
#
# Merchant knowledge web is the seed query — Descriptor → Merchant →
# Category traversal replaces the PostgreSQL ANY()/unnest correlated
# subquery that today re-flattens the cross-user merchant rollup on
# every resolver call. Transfer-leg linking + recurring-chain queries
# ride the same graph.

app: fylo
graph_template: "fylo:<workspace_id>"

node_labels:
  User:
    required: [id]
    optional: [email]
  Merchant:
    required: [normalizedName]
    optional: [displayName, parentCompany, businessType, confidence, globalUseCount]
  Descriptor:
    required: [pattern]
    optional: [patternType]
  Category:
    required: [name]
    optional: [groupId, isIncome]
  Account:
    required: [id, type]
    optional: [institution, isOffBudget]
  FinancialEvent:
    required: [id, amount, date]
    optional: [merchantName, transferId]
  RecurringPattern:
    required: [id, frequency]
    optional: [nextExpected, confidence, status]

edge_types:
  RESOLVES_TO:
    from: Descriptor
    to: Merchant
    props: [confidence]
  BELONGS_TO:
    from: Merchant
    to: Category
    props: []
  PARENT_OF:
    from: Merchant
    to: Merchant
    props: []
  CONFIRMED:
    from: User
    to: Merchant
    props: [count]
  TRANSFER_LEG:
    from: FinancialEvent
    to: FinancialEvent
    props: [transferId]
  INSTANCE_OF:
    from: FinancialEvent
    to: RecurringPattern
    props: [variance]

predicate_vocabulary: []
