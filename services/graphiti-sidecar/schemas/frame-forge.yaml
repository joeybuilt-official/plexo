# Phase F per-app schema for frame-forge (brand/pitch graph).
# Scaffolding only — Frame Forge graph ingest is Phase D2.

app: frame-forge
graph_template: "frame-forge:<workspace_id>"

node_labels:
  Brand:
    required: [name]
    optional: [tone, voice, palette]
  StyleRule:
    required: [rule]
    optional: [category, source_doc, confidence]
  Decision:
    required: [text, made_at]
    optional: [author, pitch_id]
  Asset:
    required: [uri]
    optional: [kind, brand_id, created_at]
  Pitch:
    required: [title]
    optional: [client, status, created_at]

edge_types:
  APPLIES_TO:
    from: StyleRule
    to: Brand
    props: []
  DERIVED_FROM:
    from: Decision
    to: Pitch
    props: []
  IN_PITCH:
    from: Asset
    to: Pitch
    props: [position]

predicate_vocabulary: []
