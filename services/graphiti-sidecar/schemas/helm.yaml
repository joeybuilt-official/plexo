# Phase F per-app schema for helm (ops graph: deploys, services, incidents).
# Scaffolding only — Helm ingest is Phase D3.

app: helm
graph_template: "helm:<workspace_id>"

node_labels:
  Deploy:
    required: [commit, deployed_at]
    optional: [actor, environment, status]
  Service:
    required: [name]
    optional: [repo, owner_team]
  Incident:
    required: [title, started_at]
    optional: [severity, resolved_at, postmortem_url]
  Runbook:
    required: [doc]
    optional: [title, last_reviewed_at]

edge_types:
  OF_SERVICE:
    from: Deploy
    to: Service
    props: []
  RESPONDS_TO:
    from: Runbook
    to: Incident
    props: []
  REFERENCES:
    from: Incident
    to: Service
    props: [role]

predicate_vocabulary: []
