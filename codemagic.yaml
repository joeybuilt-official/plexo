# Plexo client apps — Codemagic CI.
#   Android = native Flutter (apps/mobile, appId dev.plexo.Plexo)   [ADR-0001]
#   Windows = Electron       (apps/desktop, @plexo/desktop)         [ADR-0046]
#
# Triggers (fleet convention):
#   tag  v*          -> android-release  (signed APK+AAB, emailed)
#                    -> windows-desktop  (NSIS + portable .exe, emailed)
#   tag  release-v*  -> android-publish  (signed AAB -> Play internal, draft)
#
# One-time operator setup (Codemagic UI):
#   - Env group `plexo-android-signing`: CM_KEYSTORE (base64 of the .jks),
#     CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD.
#   - Env group `google-play` (android-publish only): GCLOUD_SERVICE_ACCOUNT_CREDENTIALS.
workflows:
  # ── Android: native Flutter, build + sign + email APK/AAB ───────────────────
  android-release:
    name: Android — Flutter build + sign + email
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - plexo-android-signing
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts: &flutter_build
      - name: Get packages
        script: flutter pub get
        working_directory: apps/mobile
      - name: Analyse
        script: flutter analyze
        working_directory: apps/mobile
      - name: Widget tests
        script: flutter test --reporter=expanded
        working_directory: apps/mobile
      - name: Decode keystore + build signed APK + AAB
        working_directory: apps/mobile
        script: |
          # Strip ALL whitespace before decoding — a CM_KEYSTORE pasted with line
          # wraps decodes to a corrupt blob; printf avoids a trailing newline.
          printf '%s' "$CM_KEYSTORE" | tr -d '[:space:]' | base64 --decode > /tmp/plexo-upload.jks
          export CM_KEYSTORE_PATH=/tmp/plexo-upload.jks
          # Fail loud if the secret didn't yield a readable keystore, rather than
          # silently shipping a debug-signed artifact.
          keytool -list -keystore /tmp/plexo-upload.jks -storepass "$CM_KEYSTORE_PASSWORD" >/dev/null 2>&1 \
            || { echo "ERROR: CM_KEYSTORE did not decode to a keystore readable with CM_KEYSTORE_PASSWORD — re-set the plexo-android-signing secrets."; exit 1; }
          flutter build apk --release \
            --build-name=1.0.$PROJECT_BUILD_NUMBER \
            --build-number=$PROJECT_BUILD_NUMBER
          flutter build appbundle --release \
            --build-name=1.0.$PROJECT_BUILD_NUMBER \
            --build-number=$PROJECT_BUILD_NUMBER
    artifacts: &flutter_artifacts
      - apps/mobile/build/app/outputs/flutter-apk/app-release.apk
      - apps/mobile/build/app/outputs/bundle/release/app-release.aab
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true

  # ── Android: build + publish AAB to Play internal (draft) ──────────────────
  android-publish:
    name: Android — Flutter build + publish to Play (internal)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - plexo-android-signing
        - google-play
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'release-v*'
          include: true
    scripts: *flutter_build
    artifacts: *flutter_artifacts
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  # ── Windows: Electron installer (NSIS) + portable, emailed ─────────────────
  windows-desktop:
    name: Windows — Electron build + email
    instance_type: windows_x2
    max_build_duration: 60
    environment:
      node: 22
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Install pnpm
        # npm (always on the node image) instead of corepack — corepack's
        # signature check is flaky on Codemagic's Windows runners and failed the
        # build at this step.
        script: npm install -g pnpm@10.30.3
      - name: Install workspace deps
        # --ignore-scripts: skip native postinstalls (e.g. isolated-vm in
        # @plexo/agent) the desktop shell never bundles; electron-builder pulls
        # its own Electron binaries, so packaging is unaffected.
        script: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build Windows installer (NSIS + portable)
        script: pnpm --filter @plexo/desktop run dist
    artifacts:
      - apps/desktop/dist/*.exe
      - apps/desktop/dist/*.msi
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
