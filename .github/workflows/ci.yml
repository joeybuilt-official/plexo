name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    # `pnpm lint` was silently broken for months (an unbounded brace-expansion
    # override resolved minimatch@3's dependency to an incompatible major), and
    # because nothing ran it in CI, apps/web quietly accumulated 36 errors —
    # 17 of them React Compiler correctness bugs. Both are fixed; this job is
    # what stops it happening again.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  arch:
    # Clean Architecture boundary gate (ADR 0001). `--ignore-known` holds a
    # baseline of violations that already existed when the gate was wired; it is
    # a RATCHET, not an allowlist — new violations fail, and the baseline is
    # being burned down cluster by cluster. Never regenerate it to make a build
    # pass: `pnpm arch:baseline` is for recording a deliberate, reviewed change.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @joeybuilt/plexo-sdk resolves through its "exports" map to dist/,
      # which a fresh install does not produce. Without this the cruise reports
      # 11 false not-unresolvable errors — locally it only passed because a
      # stale dist/ happened to be lying around.
      - run: pnpm --filter @joeybuilt/plexo-sdk build
      - run: pnpm arch:check

  db-drift:
    # Phase J0 schema-vs-DDL gate: every pgTable() in schema.ts must have a
    # CREATE TABLE or RENAME TO in packages/db/drizzle/*.sql.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plexo/db db:check-drift

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Root suites live outside the turbo graph, so `pnpm test` never reached
      # them and they rotted unnoticed. `test:integration` still needs Postgres
      # + Redis service containers and is wired up separately.
      - run: pnpm test:unit
