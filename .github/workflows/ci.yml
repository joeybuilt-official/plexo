name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    # `pnpm lint` was silently broken for months (an unbounded brace-expansion
    # override resolved minimatch@3's dependency to an incompatible major), and
    # because nothing ran it in CI, apps/web quietly accumulated 36 errors —
    # 17 of them React Compiler correctness bugs. Both are fixed; this job is
    # what stops it happening again.
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # A static check the type system cannot make: interpolating a JS array
      # into a `::type[]` cast renders a ROW constructor and fails at runtime.
      # Three call sites shipped that way and swallowed the error.
      - run: pnpm check:sql-arrays
      # AGENTS.md claimed `--check` gated mirror drift. It did not, so a rule
      # edit without a regen silently staled the copies Cursor/Cline/Windsurf/
      # Copilot/Gemini/aider read. Now it does.
      - run: sh scripts/sync-agents.sh --check
      # AGENTS.md also cited `scripts/check-docs.sh` as a required gate and
      # `docs/claude/worklog.md` as the worklog; neither ever existed, and the
      # docs described three apps deleted in 282e1f5. Docs make falsifiable
      # claims about the filesystem — this falsifies them.
      - run: sh scripts/check-doc-refs.sh

  arch:
    # Clean Architecture boundary gate (ADR 0001). `--ignore-known` holds a
    # baseline of violations that already existed when the gate was wired; it is
    # a RATCHET, not an allowlist — new violations fail, and the baseline is
    # being burned down cluster by cluster. Never regenerate it to make a build
    # pass: `pnpm arch:baseline` is for recording a deliberate, reviewed change.
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @joeybuilt/plexo-sdk resolves through its "exports" map to dist/,
      # which a fresh install does not produce. Without this the cruise reports
      # 11 false not-unresolvable errors — locally it only passed because a
      # stale dist/ happened to be lying around.
      - run: pnpm --filter @joeybuilt/plexo-sdk build
      - run: pnpm arch:check

  db-drift:
    # Phase J0 schema-vs-DDL gate: every pgTable() in schema.ts must have a
    # CREATE TABLE or RENAME TO in packages/db/drizzle/*.sql.
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plexo/db db:check-drift

  docker-build:
    # PR #139 shipped a main that no image could build: pnpm.patchedDependencies
    # was added to the root package.json without copying patches/ into either
    # Dockerfile's deps stage, so `pnpm install --frozen-lockfile` failed with
    # ENOENT /app/patches/sharp@0.35.0.patch and BOTH images were undeployable.
    # Every other gate was green, because no job here ever built an image. This
    # is that job. It builds only — publishing is a separate, credentialed step.
    #
    # Runs on the one self-hosted runner that has the Docker socket, which is
    # why it is back on pull_request: #161 had to restrict it to push events
    # because no runner could build an image and GitHub-hosted minutes were
    # exhausted, so it would have sat red on every PR.
    runs-on: [self-hosted, docker]
    timeout-minutes: 30
    strategy:
      # Report both images. Without this a web failure would mask an api one,
      # which is exactly the case #139 was.
      fail-fast: false
      matrix:
        image: [web, api]
    steps:
      - uses: actions/checkout@v4
      # Plain `docker build`, not buildx with a GHA cache: `type=gha` writes to
      # the GitHub Actions cache service, which is not reachable from a
      # self-hosted runner. The builder here is long-lived, so the daemon's own
      # layer cache already does that job — and does it across runs for free.
      # Both Dockerfiles derive the build id from SOURCE_COMMIT and otherwise
      # fall back to reading .git, so pass it explicitly rather than depend on
      # checkout depth.
      - name: Build the ${{ matrix.image }} image
        run: |
          docker build \
            --file docker/Dockerfile.${{ matrix.image }} \
            --build-arg SOURCE_COMMIT=${{ github.sha }} \
            --tag plexo-${{ matrix.image }}:ci-${{ github.run_id }} \
            .

      # The daemon is shared with production containers on this host, so the
      # run's image must not be left behind. Untagged parents stay in the layer
      # cache, which is what makes the next build fast.
      - name: Remove the run's image tag
        if: always()
        run: docker image rm plexo-${{ matrix.image }}:ci-${{ github.run_id }} || true

  graphiti-sidecar:
    # The Python sidecar's first CI coverage. Until this job no gate in the repo
    # touched services/graphiti-sidecar/**: every TypeScript check stayed green
    # while the image could not build (the upstream watcher passed the service
    # directory as the build context, but the Dockerfile COPYs
    # services/graphiti-sidecar/..., so it had failed daily since 2026-08-30)
    # and, separately, could not boot — the direct deps are pinned but their
    # deps are not, and openai 3.x moved to the `httpx2` distribution while
    # graphiti-core still `import httpx`, then redis 8.x changed the constructor
    # falkordb calls. Prod kept serving only because its image predates both.
    #
    # Not path-filtered on purpose: the failure this catches arrives from an
    # upstream release, with no diff under services/graphiti-sidecar at all. The
    # cost is one more job on the single docker-labelled runner; the daily
    # graphiti-upstream-watcher covers the days with no PR.
    runs-on: [self-hosted, docker]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the sidecar image
        run: |
          docker build \
            --file services/graphiti-sidecar/Dockerfile \
            --tag graphiti-sidecar:ci-${{ github.run_id }} \
            .

      # Stands up a throwaway FalkorDB plus a stub inference backend, then
      # drives ingest -> graph read -> search. See test/probe_client.py for what
      # each assertion catches; extraction QUALITY is deliberately not asserted.
      - name: Probe ingest + search against a real FalkorDB
        run: |
          PROBE_IMAGE=graphiti-sidecar:ci-${{ github.run_id }} \
            bash services/graphiti-sidecar/test/probe.sh

      - name: Remove the run's image tag
        if: always()
        run: docker image rm graphiti-sidecar:ci-${{ github.run_id }} || true

  test:
    runs-on: [self-hosted]
    timeout-minutes: 10
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Root suites live outside the turbo graph, so `pnpm test` never reached
      # them and they rotted unnoticed. `test:integration` still needs Postgres
      # + Redis service containers and is wired up separately.
      - run: pnpm test:unit

  integration:
    # Root integration suite. It was dark for months: 19 files that nothing ran,
    # so the fixtures rotted against the code they were meant to guard. It needs
    # real Postgres (with pgvector — memory_entries.embedding is vector(384)) and
    # real Redis.
    #
    # It cannot use `services:` — the self-hosted runners have no Docker socket.
    # Instead it reaches long-lived CI Postgres/Redis over the runner network and
    # carves its own database per run, because the suite requires a clean one:
    # a leftover queued task from an earlier run makes the global `claim()` in
    # concurrent-claims pick up someone else's row.
    runs-on: [self-hosted]
    timeout-minutes: 20
    needs: typecheck
    env:
      REDIS_URL: ${{ secrets.CI_REDIS_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create an isolated database for this run
        env:
          BASE_URL: ${{ secrets.CI_DATABASE_URL }}
        run: |
          set -euo pipefail
          DB="ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          psql "$BASE_URL" -v ON_ERROR_STOP=1 -q \
            -c "DROP DATABASE IF EXISTS \"$DB\";" \
            -c "CREATE DATABASE \"$DB\";"
          URL="${BASE_URL%/*}/$DB"
          echo "::add-mask::$URL"
          echo "DATABASE_URL=$URL" >> "$GITHUB_ENV"
          echo "CI_RUN_DB=$DB" >> "$GITHUB_ENV"

      - run: pnpm db:migrate
      # Migrations 0130-0143 are un-journaled orphans applied by hand in prod;
      # drizzle-kit will not replay them, so a database built only from the
      # journal is missing columns the suite writes to.
      - run: pnpm db:apply-orphaned
      - run: pnpm test:integration

      - name: Drop the run database
        if: always()
        env:
          BASE_URL: ${{ secrets.CI_DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$BASE_URL" -q -c "DROP DATABASE IF EXISTS \"${CI_RUN_DB}\" WITH (FORCE);" || true
