name: Deploy Plexo Services

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-plexo
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_REPO: ${{ secrets.VPS_REPO || '/opt/plexo' }}
      COMPOSE_DIR: ${{ secrets.COMPOSE_DIR || '/opt/app/infra' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Detect changed services
        id: changes
        run: |
          SERVICES=""
          NO_BUILD_SERVICES=""
          # Manual trigger or failed diff → rebuild all
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
          # Compose-spec changes apply to image-only services (e.g. falkordb)
          # that the per-commit filter never lists. The narrow HEAD~1..HEAD
          # diff would miss a compose change that landed in a previous
          # commit but never got picked up (because that commit also had no
          # service-source changes). Widen the window for compose detection
          # so a pending spec change is still applied on the next deploy.
          # `docker compose up -d --no-deps` is idempotent — repeat runs
          # against an unchanged spec are no-ops, so a wider window is safe.
          COMPOSE_CHANGED=$(git diff --name-only HEAD~5 HEAD 2>/dev/null \
            || git diff --name-only HEAD~1 HEAD 2>/dev/null \
            || echo "all")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANGED="all"
            COMPOSE_CHANGED="all"
          fi

          if echo "$CHANGED" | grep -qE '^(apps/api|packages/|docker/Dockerfile\.api)' || [ "$CHANGED" = "all" ]; then
            SERVICES="plexo-api cc-plexo-api"
          fi

          if echo "$CHANGED" | grep -qE '^(apps/web|packages/|docker/Dockerfile\.web)' || [ "$CHANGED" = "all" ]; then
            SERVICES="$SERVICES plexo-saas"
          fi

          # Image-only services that need recreation on compose-spec drift
          # (no `--build` — these aren't built from this repo).
          if echo "$COMPOSE_CHANGED" | grep -qE '^docker-compose(\.prod)?\.yml$' || [ "$COMPOSE_CHANGED" = "all" ]; then
            NO_BUILD_SERVICES="falkordb"
          fi

          SERVICES=$(echo "$SERVICES" | xargs)
          NO_BUILD_SERVICES=$(echo "$NO_BUILD_SERVICES" | xargs)
          if [ -z "$SERVICES" ] && [ -z "$NO_BUILD_SERVICES" ]; then
            echo "No services to rebuild or recreate"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "no_build_services=$NO_BUILD_SERVICES" >> "$GITHUB_OUTPUT"
          echo "Rebuilding: ${SERVICES:-none}"
          echo "Recreating (no build): ${NO_BUILD_SERVICES:-none}"

      - name: Setup SSH
        if: steps.changes.outputs.skip != 'true'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::secrets.VPS_SSH_KEY is empty or unset"
            exit 1
          fi
          if [ -z "${VPS_HOST:-}" ]; then
            echo "::error::secrets.VPS_HOST is empty or unset"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Drop the `2>/dev/null` so a DNS or port-22 problem surfaces here
          # rather than as a silent fail in rsync/ssh downstream.
          echo "==> ssh-keyscan $VPS_HOST"
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          if ! grep -q . ~/.ssh/known_hosts; then
            echo "::error::ssh-keyscan produced no host keys for $VPS_HOST — VPS may be unreachable"
            exit 1
          fi

      - name: Verify VPS reachable
        if: steps.changes.outputs.skip != 'true'
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
              -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
              'echo "==> reachable as $(whoami)@$(hostname); pwd=$(pwd); free disk:"; df -h /opt /var 2>/dev/null | head -6'

      - name: Sync code to VPS
        if: steps.changes.outputs.skip != 'true'
        run: |
          set -euo pipefail
          rsync -avzP --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env*' \
            -e "ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key" \
            ./ "$VPS_USER@$VPS_HOST:$VPS_REPO/" \
          | tail -200

      - name: Rebuild services
        if: steps.changes.outputs.skip != 'true' && steps.changes.outputs.services != ''
        env:
          SERVICES: ${{ steps.changes.outputs.services }}
        run: |
          set -euo pipefail
          # All vars expand on the runner side before SSH sends the command
          # string. The previous `<<'REMOTE'` heredoc form sent $COMPOSE_DIR
          # literally; non-interactive SSH sessions don't load the user's
          # shell profile, so the remote bash saw it as empty and `cd ""`
          # silently dropped to $HOME — the compose files weren't there →
          # docker compose failed within seconds with no useful log.
          # `set -ex` makes each remote command + its expansion visible in
          # the Actions log so future failures surface their real cause.
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
              -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "set -ex; cd '$COMPOSE_DIR' && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --no-deps $SERVICES 2>&1"

      - name: Recreate image-only services (no build)
        if: steps.changes.outputs.skip != 'true' && steps.changes.outputs.no_build_services != ''
        env:
          NO_BUILD_SERVICES: ${{ steps.changes.outputs.no_build_services }}
        run: |
          set -euo pipefail
          # `up -d --no-deps` recreates only if the container spec drifted
          # from the image-baked config (e.g. when docker-compose.yml's
          # `command:` or env changed). For image-only services like
          # falkordb there is no `--build` to do; the new compose file
          # already landed via rsync, so this is the step that makes the
          # spec actually take effect inside the running container.
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
              -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "set -ex; cd '$COMPOSE_DIR' && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps $NO_BUILD_SERVICES 2>&1"

      - name: Install/refresh falkordb backup cron
        if: steps.changes.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # ops/falkordb-backup.cron is the host-side daily snapshot +
          # weekly S3 upload (ADR 0030). The committed file hardcodes
          # `/opt/joeybuilt/plexo` as a sensible default for operator
          # reference; we template VPS_REPO in on install so the script
          # path matches whatever the deploy actually uses.
          # AWS_S3_BACKUP_BUCKET + AWS_* still need to be set by the
          # operator in /etc/default/falkordb-backup for the Sunday
          # off-host upload line to do anything; the daily local-rotation
          # line works without them.
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
              -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "set -ex; sed 's|/opt/joeybuilt/plexo|$VPS_REPO|g' '$VPS_REPO/ops/falkordb-backup.cron' > /etc/cron.d/falkordb-backup && chmod 644 /etc/cron.d/falkordb-backup && mkdir -p /var/backups/falkordb && touch /var/log/falkordb-backup.log"

      - name: Verify falkordb config + freshness
        if: steps.changes.outputs.skip != 'true' && contains(steps.changes.outputs.no_build_services, 'falkordb')
        run: |
          set -euo pipefail
          # Self-check on every falkordb recreate: confirm the new --save
          # tiers are actually in the running container's Cmd, and log
          # LASTSAVE so future regressions are visible in the Actions log
          # instead of waiting for the host-side backup-absent-alert to fire.
          # Doesn't fail the deploy — LASTSAVE may be stale immediately after
          # recreate; the in-process 3600/1 tier picks up on the next write.
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
              -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            'set -ex
             sleep 5
             echo "==> falkordb container Cmd:"
             docker inspect service --format "{{ .Config.Cmd }}"
             echo "==> LASTSAVE (epoch) / age:"
             LASTSAVE=$(docker exec service redis-cli LASTSAVE)
             NOW=$(date +%s)
             AGE=$(( NOW - LASTSAVE ))
             AGE_H=$(( AGE / 3600 ))
             echo "lastsave=$LASTSAVE  now=$NOW  age=${AGE}s (${AGE_H}h)"
             if [ "$AGE_H" -gt 25 ]; then
               echo "::warning::LASTSAVE is ${AGE_H}h old (>25h). Expected — container was just recreated; next write should trigger BGSAVE via the 3600/1 tier within the hour."
             fi'
