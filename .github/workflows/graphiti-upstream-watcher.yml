# Phase 11 — graphiti-core upstream version watcher AND daily sidecar canary.
#
# Two jobs in one, deliberately:
#
#  1. Every run builds the sidecar image at the CURRENT pin and probes it. The
#     sidecar's dependencies are pinned but their dependencies are not, so an
#     upstream release can break the image with no commit here — and on
#     2026-09-02 two had, silently: openai 3.x moved to the `httpx2`
#     distribution (graphiti-core still `import httpx`) and redis 8.x changed
#     the constructor falkordb calls. Prod kept running only because its image
#     predates both. Nothing in this repo notices that class of failure unless
#     something builds the image on a schedule; this is that something.
#  2. When PyPI has a newer graphiti-core, it builds and probes THAT pin too,
#     and opens a PR only if the probe passed. NEVER auto-merges.
#
# The probe (services/graphiti-sidecar/test/probe.sh) stands up a throwaway
# FalkorDB + the image under test and drives ingest → graph read → search. It
# replaced a Kuzu snapshot restore that fetched prod data over SSH: Kuzu is gone
# (ADR 0010), and that step still carried `<prod-server-ip>` placeholders, so it
# could never have run. No prod data and no deploy key are involved now.
#
# A failure here is a real signal: `workflow-health.yml` opens an issue once any
# scheduled workflow fails twice running.

name: graphiti-core upstream watcher

on:
  schedule:
    - cron: '0 14 * * *'  # 14:00 UTC daily
  workflow_dispatch: {}    # manual trigger for testing

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: graphiti-upstream-watcher
  cancel-in-progress: false

jobs:
  check-and-probe:
    # Needs the Docker socket, which only the `docker`-labelled self-hosted
    # runner has — and self-hosted consumes no GitHub Actions minutes, the
    # constraint that took CI down in August.
    runs-on: [self-hosted, docker]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect latest graphiti-core release
        id: detect
        run: |
          PINNED=$(grep -oE 'graphiti-core==[0-9]+\.[0-9]+\.[0-9]+' \
            services/graphiti-sidecar/requirements.txt | cut -d= -f3)
          LATEST=$(curl -fsS https://pypi.org/pypi/graphiti-core/json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); \
              vs=[v for v in d["releases"] if not any(c in v for c in ("a","b","rc","dev"))]; \
              vs.sort(key=lambda v: tuple(int(x) for x in v.split("."))); \
              print(vs[-1])')
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [[ "$PINNED" == "$LATEST" ]]; then
            echo "no-op: $PINNED already latest"
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
          else
            BRANCH="chore/graphiti-core-$LATEST"
            # Idempotency guard. This cron re-runs daily while the pin lags $LATEST.
            # Once an earlier run has opened the bump branch, a fresh commit built
            # off the newer main diverges from it, so `git push` is rejected
            # non-fast-forward — the daily failure. Treat an existing bump branch as
            # "already handled" and no-op today; deleting the branch re-arms the bump.
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              echo "bump branch $BRANCH already exists on origin — already handled; no-op"
              echo "needs_bump=false" >> "$GITHUB_OUTPUT"
            else
              echo "bump candidate: $PINNED → $LATEST"
              echo "needs_bump=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Runs unconditionally — this is the daily canary, not part of the bump.
      # The build context is the repo root: the Dockerfile COPYs
      # `services/graphiti-sidecar/...`, so building with the service directory
      # as context fails on "/services/graphiti-sidecar: not found", which is
      # exactly how this workflow died every day from 2026-08-30.
      - name: Build + probe the CURRENT pin
        run: |
          docker build \
            --file services/graphiti-sidecar/Dockerfile \
            --tag graphiti-sidecar:probe-current-${{ github.run_id }} \
            .
          PROBE_IMAGE=graphiti-sidecar:probe-current-${{ github.run_id }} \
            bash services/graphiti-sidecar/test/probe.sh

      - name: Open feature branch + bump pin
        if: steps.detect.outputs.needs_bump == 'true'
        run: |
          git config user.name 'joeybuilt-bot'
          git config user.email 'bot@joeybuilt.com'
          BRANCH="chore/graphiti-core-${{ steps.detect.outputs.latest }}"
          git checkout -b "$BRANCH"
          sed -i "s|graphiti-core==${{ steps.detect.outputs.pinned }}|graphiti-core==${{ steps.detect.outputs.latest }}|" \
            services/graphiti-sidecar/requirements.txt
          git add services/graphiti-sidecar/requirements.txt
          git commit -m "chore(graphiti-core): bump ${{ steps.detect.outputs.pinned }} → ${{ steps.detect.outputs.latest }}"
          # NOTE: the push is deliberately BELOW the probe. It used to run here,
          # so when the build step failed — as it did every day from 2026-08-30 —
          # the branch was already pushed and `gh pr create` never ran. Result: a
          # fresh orphan branch daily, no PR, no signal. Push only after a pass.

      - name: Build + probe the CANDIDATE pin
        if: steps.detect.outputs.needs_bump == 'true'
        run: |
          docker build \
            --file services/graphiti-sidecar/Dockerfile \
            --tag graphiti-sidecar:probe-${{ steps.detect.outputs.latest }} \
            .
          PROBE_IMAGE=graphiti-sidecar:probe-${{ steps.detect.outputs.latest }} \
            bash services/graphiti-sidecar/test/probe.sh

      - name: Push branch (only after the probe passed)
        if: steps.detect.outputs.needs_bump == 'true'
        run: git push origin "chore/graphiti-core-${{ steps.detect.outputs.latest }}"

      - name: Open PR with probe result
        if: steps.detect.outputs.needs_bump == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(curl -fsS "https://api.github.com/repos/getzep/graphiti/releases/tags/v${{ steps.detect.outputs.latest }}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("body","(no release notes)")[:2000])')
          gh pr create \
            --title "chore(graphiti-core): bump to ${{ steps.detect.outputs.latest }}" \
            --body "$(cat <<EOF
          Automated upstream bump per Phase 11.

          - **Previous pin:** ${{ steps.detect.outputs.pinned }}
          - **New pin:** ${{ steps.detect.outputs.latest }}
          - **Schema-compat probe:** PASS (workflow run ${{ github.run_id }})

          The probe built this pin's image, stood it up against a throwaway
          FalkorDB, ingested an episode, read the graph back, and searched it.
          It does NOT judge extraction quality — the inference backend is a stub
          that answers with schema-shaped constants.

          Upstream release notes (truncated to 2000 chars):

          \`\`\`
          $NOTES
          \`\`\`

          ## ⚠ Operator review checklist

          - [ ] Read the full upstream changelog at https://github.com/getzep/graphiti/releases/tag/v${{ steps.detect.outputs.latest }}
          - [ ] Confirm no FalkorDB storage or index-format breaking change is called out
          - [ ] Confirm the transitive pins in requirements.txt (openai, redis) are still the right bounds for this release
          - [ ] Merge → auto-deploy daemon ships

          NEVER auto-merge. NEVER skip the operator review.
          EOF
          )" \
            --base main \
            --head "chore/graphiti-core-${{ steps.detect.outputs.latest }}"

      # The daemon is shared with production containers on this host, so the
      # run's image tags must not be left behind. Untagged parents stay in the
      # layer cache, which is what makes the next build fast.
      - name: Remove the run's image tags
        if: always()
        run: |
          docker image rm graphiti-sidecar:probe-current-${{ github.run_id }} || true
          docker image rm graphiti-sidecar:probe-${{ steps.detect.outputs.latest }} || true
